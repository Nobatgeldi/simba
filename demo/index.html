<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simba Arayüz Demosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1b2a6b; --text:#25315f; --muted:#6a76a3; --faint:#9aa4c7;
  --blue:#2b59e8; --blue-2:#4b7bff; --blue-soft:#e6eeff;
  --yellow:#ffc928; --yellow-d:#e2a800; --gold:#ffb800;
  --green:#1fb873; --green-soft:#d9f7e9; --green-d:#159a5e;
  --red:#ee4a5d; --red-soft:#ffe3e7; --red-d:#c9364a;
  --purple:#7b5cf0; --lav:#ece6ff; --mint:#d8f6ea;
  --card:#ffffff; --line:#e3e9f7; --line-d:#cfd8ee;
  --shadow:0 2px 0 rgba(43,89,232,.05),0 10px 26px rgba(43,89,232,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:#e9effb;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:default}

/* ---------- page chrome ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1280px;margin:0 auto;padding:14px 16px}
.page-head h1{font-size:18px;margin:0;font-weight:900;color:var(--navy)}
.page-head p{margin:0;color:var(--muted);font-size:13px;font-weight:700}
.head-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
.head-link{font-weight:800;font-size:13px;color:var(--blue);text-decoration:none}
.stage{display:flex;justify-content:center;padding:0 16px 24px}
.device{position:relative;overflow:hidden;background:#f3f7ff}
.stage[data-mode="mobile"] .device{width:390px;height:min(844px,calc(100vh - 92px));min-height:640px;border-radius:46px;border:10px solid #121833;box-shadow:0 30px 60px rgba(27,42,107,.25)}
.stage[data-mode="web"] .device{width:100%;max-width:1280px;height:calc(100vh - 92px);min-height:640px;border-radius:18px;border:1px solid var(--line-d);box-shadow:0 20px 50px rgba(27,42,107,.15)}
@media (max-width:600px){
  .page-head{display:none}
  .stage{padding:0}
  .stage[data-mode] .device{width:100%;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}
}

/* ---------- app ---------- */
.app{position:absolute;inset:0;container-type:inline-size;container-name:app;background:linear-gradient(180deg,#d6e6ff 0%,#eaf2ff 26%,#f4f7ff 60%)}
.shell{height:100%;display:grid;grid-template-columns:1fr}
.side,.rail{display:none}
.center{display:flex;flex-direction:column;min-height:0;min-width:0}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 28px;scrollbar-width:thin}
.main-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.flg{display:inline-block;vertical-align:-2px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(27,42,107,.12);flex:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:14px 14px 10px}
.logo{display:flex;align-items:center;gap:6px;font-weight:900;font-size:23px;color:var(--navy);letter-spacing:-.02em}
.logo svg:not(.flg){width:42px;height:42px;flex:none}
.logo-btn{position:relative;flex:none;display:grid}
.logo-btn .flg{position:absolute;right:-3px;bottom:-1px;box-shadow:0 0 0 2px #fff}
.page-title{display:none;font-size:24px;font-weight:900;color:var(--navy)}
.tb-r{display:flex;align-items:center;gap:6px}
.pill{display:flex;align-items:center;gap:0;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);border-radius:999px;padding:3px;box-shadow:0 4px 14px rgba(43,89,232,.1)}
.pill .it{display:flex;align-items:center;gap:3px;padding:5px 6px;border-radius:999px;font-weight:900;font-size:13.5px;color:var(--navy);white-space:nowrap}
.pill .it.flag{display:none;padding:5px 8px;background:var(--blue-soft)}
.pill button.it:hover{background:var(--blue-soft)}
.bell{position:relative;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;box-shadow:0 4px 14px rgba(43,89,232,.1);flex:none}
.bell svg{width:22px;height:22px;fill:var(--blue)}
.dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}

.tabbar{display:flex;justify-content:space-around;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(43,89,232,.08);padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:#7c88b5;padding:4px 0;position:relative}
.tab svg{width:26px;height:26px;fill:#8794c4}
.tab.on{color:var(--blue)}
.tab.on svg{fill:var(--blue)}
.tab.on::after{content:"";position:absolute;bottom:-6px;width:28px;height:4px;border-radius:4px;background:var(--blue)}

.side{flex-direction:column;gap:6px;padding:20px 14px;border-right:1px solid var(--line);background:rgba(255,255,255,.6)}
.side .logo{padding:0 8px 18px}
.navi{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;font-weight:800;font-size:15px;color:#5f6c9e;border:2px solid transparent;text-align:left}
.navi svg{width:24px;height:24px;fill:#8794c4}
.navi:hover{background:#fff}
.navi.on{background:var(--blue-soft);border-color:#c9d8ff;color:var(--blue)}
.navi.on svg{fill:var(--blue)}
.side .spacer{flex:1}
.side .prem{flex-direction:column;align-items:flex-start;gap:6px}
.side .prem .go{margin-left:0}
.rail{flex-direction:column;gap:16px;padding:16px 18px 28px 0;overflow-y:auto}

@container app (min-width:760px){
  .shell{grid-template-columns:230px 1fr}
  .side{display:flex}
  .tabbar{display:none}
  .topbar .logo{display:none}
  .page-title{display:block}
  .main .hero .marks{display:flex}
  .pill .it.flag{display:flex}
  .pill .it{padding:5px 9px;font-size:14.5px}

  .topbar{padding:20px 24px 10px}
  .main{padding:6px 24px 32px}
  .sheet-wrap{align-items:center}
  .sheet{border-radius:26px;max-width:460px;margin:0 16px}
}
@container app (min-width:1100px){
  .shell{grid-template-columns:240px 1fr 330px}
  .rail{display:flex}
  .mobile-only{display:none !important}
}

/* ---------- common ---------- */
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.sec-h h3{margin:0;font-size:18px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:8px}
.sec-h .sub{font-size:13px;color:var(--muted);font-weight:700}
.link{font-size:13px;font-weight:800;color:var(--navy);background:#fff;padding:7px 12px;border-radius:999px;box-shadow:0 2px 10px rgba(43,89,232,.1);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900;border-radius:999px;padding:13px 24px;font-size:16px;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn-y{background:var(--yellow);color:var(--navy);box-shadow:0 4px 0 var(--yellow-d)}
.btn-y:active{box-shadow:0 2px 0 var(--yellow-d)}
.btn-b{background:var(--blue);color:#fff;box-shadow:0 4px 0 #1d43b8}
.btn-g{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn-r{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.btn-w{background:#fff;color:var(--navy);box-shadow:0 3px 0 var(--line-d);border:1px solid var(--line)}
.btn-block{width:100%}
.btn:disabled{background:#e4e9f4;color:#a3adc9;box-shadow:0 4px 0 #cfd6e6}
.bar{height:10px;background:#e7ecf7;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffcd3c,#ffae00);border-radius:999px;transition:width .4s}
.bar.blue i{background:linear-gradient(90deg,#5b8bff,#2b59e8)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.badge.gold{background:#fff1c7;color:#a86c00}
.badge.green{background:var(--green-soft);color:var(--green-d)}
.badge.purple{background:var(--lav);color:var(--purple)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:26px 22px;min-height:196px;background:linear-gradient(160deg,#d3e4ff 0%,#a8c6ff 55%,#8fb3ff 100%);box-shadow:var(--shadow)}
.hero h2{margin:0;font-size:28px;line-height:1.1;font-weight:900;color:var(--navy);max-width:58%}
.hero p{margin:8px 0 18px;font-weight:700;color:#33427d;max-width:52%;font-size:15.5px}
.hero .lion{position:absolute;right:-4px;bottom:-6px;width:170px;height:198px}
.hero .marks{position:absolute;right:190px;bottom:12px;font-size:40px;display:none;gap:8px;opacity:.9}
.hero .spark{position:absolute;right:150px;top:56px;font-size:20px}

.quick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.qc > span:nth-child(2){min-width:0;overflow-wrap:break-word}
/* Dar ekranda ikon üstte: Türkmence/Rusça uzun kelimeler bölünmeden sığar */
@container app (max-width:480px){
  .qc{flex-direction:column;align-items:flex-start;gap:6px}
  .qc .chev{position:absolute;right:14px;top:14px}
  .qc .cnt{right:32px;top:12px}
  .qc b{font-size:15px}
}
.qc{display:flex;align-items:center;gap:8px;padding:14px 12px;border-radius:22px;text-align:left;box-shadow:var(--shadow);position:relative}
.qc .em{font-size:28px;line-height:1}
.qc b{display:block;font-size:15.5px;font-weight:900;color:var(--navy)}
.qc small{display:block;font-size:12.5px;font-weight:700;color:#55639a;line-height:1.3}
.qc .chev{margin-left:auto;font-weight:900;color:var(--navy)}
.qc.lav{background:linear-gradient(135deg,#efe9ff,#e2d8ff)}
.qc.mint{background:linear-gradient(135deg,#ddf8ee,#c8f1e0)}
.qc .cnt{position:absolute;top:8px;right:10px;background:var(--red);color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:1px 7px}

/* path */
.unit{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start}
.unit-l{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.lvl{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:20px;background:#fff;box-shadow:var(--shadow);text-align:left}
.lvl .em{font-size:28px}
.lvl b{display:block;font-size:16px;font-weight:900;color:var(--navy)}
.lvl small{font-size:13px;font-weight:700;color:var(--muted)}
.readcard{border-radius:22px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.readcard .pic{background:linear-gradient(180deg,#dbe9ff,#c9efc4);height:132px;display:grid;place-items:end center}
.readcard .pic svg{width:120px;height:130px;margin-bottom:-6px}
.readcard .st{padding:10px 14px 14px}
.readcard .st b{font-size:15px;font-weight:900;color:var(--navy)}
.readcard .st .bar{margin-top:6px}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:10px 0 20px;position:relative}
.node-w{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:86px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:32px;position:relative;transition:transform .1s}
.node:active{transform:translateY(4px)}
.node.cur{background:radial-gradient(circle at 50% 35%,#ffe27a,#ffbf1a 70%);box-shadow:0 8px 0 #d99a00,0 0 0 8px rgba(255,201,40,.25),0 14px 30px rgba(255,170,0,.35);animation:pulse 2s infinite}
.node.done{background:radial-gradient(circle at 50% 35%,#ffe27a,#ffbf1a 70%);box-shadow:0 8px 0 #d99a00}
.node.lock{background:radial-gradient(circle at 50% 35%,#f1f4fa,#d6dceb 75%);box-shadow:0 8px 0 #b3bcd2;filter:grayscale(1);opacity:.85}
.node .mini{position:absolute;bottom:-4px;right:2px;font-size:16px;background:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.12);filter:none}
.node-lbl{font-size:12px;font-weight:800;color:var(--muted);margin-top:12px}
.node-w.has-tip{margin-top:34px}
.tip{position:absolute;left:50%;top:-40px;translate:-50% 0;background:#fff1c7;color:#6b4a00;font-weight:900;font-size:13px;padding:8px 12px;border-radius:14px;transform:rotate(-4deg);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.08)}
@keyframes pulse{0%,100%{box-shadow:0 8px 0 #d99a00,0 0 0 8px rgba(255,201,40,.25),0 14px 30px rgba(255,170,0,.35)}50%{box-shadow:0 8px 0 #d99a00,0 0 0 14px rgba(255,201,40,.12),0 14px 30px rgba(255,170,0,.35)}}

/* quests */
.quests{padding:16px}
.qrow{display:flex;gap:6px;align-items:flex-start}
.q{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:13px;font-weight:800;color:var(--navy)}
.q .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#eef2fb;position:relative}
.q.ok .ic{background:var(--green-soft)}
.q.ok .ic::after{content:"✓";position:absolute;right:-4px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid #fff}
.q .n{font-size:12px;background:#eef2fb;color:var(--muted);padding:1px 8px;border-radius:999px}
.timer{font-size:12.5px;font-weight:900;color:#b0620a;background:#fff1d6;padding:5px 10px;border-radius:999px;white-space:nowrap}

.prem{display:flex;align-items:center;gap:12px;padding:16px;border-radius:22px;background:linear-gradient(110deg,#6d4ff0,#9b7dff);color:#fff;box-shadow:0 10px 26px rgba(109,79,240,.3);text-align:left;width:100%}
.prem .em{font-size:38px}
.prem b{display:block;font-size:17px;font-weight:900}
.prem small{font-size:12.5px;font-weight:700;opacity:.9}
.prem .go{margin-left:auto;background:#fff;color:var(--navy);font-weight:900;font-size:13px;padding:9px 13px;border-radius:999px;white-space:nowrap}
.prem.on{background:linear-gradient(110deg,#f5b100,#ffd34d);color:var(--navy);box-shadow:0 10px 26px rgba(245,177,0,.3)}

.tpromo{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;width:100%}
.avs{display:flex}
.avs .av{margin-left:-10px;border:3px solid #fff}
.avs .av:first-child{margin-left:0}
.tpromo b{display:block;font-weight:900;color:var(--navy);font-size:15.5px}
.tpromo small{color:var(--muted);font-weight:700;font-size:12.5px}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--green-d);font-weight:900}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(31,184,115,.2)}

/* leaderboard */
.league{padding:18px;background:linear-gradient(160deg,#fff7dc,#ffffff 60%)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:8px;margin:14px 0 6px}
.pd{display:flex;flex-direction:column;align-items:center;text-align:center}
.pd .ava{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:#e8ecff;border:4px solid #c9d4ff;position:relative}
.pd.p1 .ava{width:80px;height:80px;font-size:46px;background:#fff1c7;border-color:#ffc928}
.pd.p1 .ava::before{content:"👑";position:absolute;top:-24px;font-size:24px}
.pd .base{width:100%;margin-top:-10px;padding:16px 4px 10px;border-radius:14px 14px 6px 6px;background:linear-gradient(180deg,#eef1ff,#dfe5fb);font-weight:900;color:var(--navy)}
.pd.p1 .base{background:linear-gradient(180deg,#ffe58a,#ffd04a);padding-top:26px}
.pd.p3 .base{background:linear-gradient(180deg,#ffe2c4,#ffcfa1)}
.pd .rk{font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.pd .nm{font-size:14px}
.pd .gm{font-size:13px;color:#4b588d}
.lb{padding:6px}
.lr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;font-weight:800}
.lr + .lr{border-top:1px solid #f0f3fa}
.lr .r{width:26px;text-align:center;color:var(--muted);font-weight:900}
.lr .a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#eef2fb}
.lr .n{flex:1;min-width:0;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .g{color:var(--navy);font-weight:900;white-space:nowrap}
.lr.me{background:#fff4cf;border-top-color:transparent}
.lr.me + .lr{border-top-color:transparent}
.zone{font-size:12px;font-weight:900;color:var(--green-d);padding:6px 12px;text-align:center}

/* courses */
.chead{display:flex;align-items:center;gap:12px;padding:16px}
.chead .fl{font-size:40px}
.chead b{font-size:19px;font-weight:900;color:var(--navy);display:block}
.chead small{font-weight:700;color:var(--muted)}
.units{padding:6px}
.ur{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;text-align:left;width:100%}
.ur + .ur{border-top:1px solid #f0f3fa}
.ur .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#fff1c7;flex:none}
.ur.lk .ic{background:#eef1f7;filter:grayscale(1)}
.ur .tx{flex:1;min-width:0}
.ur b{display:block;font-weight:900;color:var(--navy)}
.ur small{color:var(--muted);font-weight:700;font-size:12.5px}
.ur .bar{margin-top:6px;height:7px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cc{overflow:hidden;text-align:left;display:flex;flex-direction:column}
.cc .cv{height:96px;display:grid;place-items:center;font-size:44px}
.cc .ci{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cc b{font-weight:900;color:var(--navy);line-height:1.25}
.cc small{color:var(--muted);font-weight:700;font-size:12.5px}
.cc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.price{font-weight:900;color:var(--navy)}

/* teachers */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chipb{padding:8px 14px;border-radius:999px;background:#fff;font-weight:800;font-size:13.5px;color:var(--muted);white-space:nowrap;box-shadow:0 2px 8px rgba(43,89,232,.08);border:2px solid transparent}
.chipb.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.tc{padding:16px;display:flex;flex-direction:column;gap:12px}
.tc-top{display:flex;gap:12px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;flex:none;position:relative}
.av.sm{width:38px;height:38px;font-size:14px}
.av .on{position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;background:var(--green);border:3px solid #fff}
.tc-top b{font-size:16.5px;font-weight:900;color:var(--navy)}
.tc-top small{display:block;color:var(--muted);font-weight:700;font-size:13px}
.tc .tags{display:flex;gap:6px;flex-wrap:wrap}
.tc .acts{display:flex;gap:8px;align-items:center}
.tc .acts .price{margin-right:auto;font-size:15px;white-space:nowrap}
.tc .acts{flex-wrap:wrap}
.tc .acts .btn{white-space:nowrap}
.tc .acts .price small{font-weight:700;color:var(--muted);font-size:12px}
.tc .btn{padding:10px 16px;font-size:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.upc{display:flex;align-items:center;gap:12px;padding:14px 16px}
.upc b{display:block;font-weight:900;color:var(--navy)}
.upc small{color:var(--muted);font-weight:700}

/* profile */
.ph{display:flex;gap:16px;align-items:center;padding:6px 2px}
.ph .big{width:118px;height:118px;border-radius:50%;background:radial-gradient(circle,#eaf2ff,#bcd3ff);border:5px solid #fff;box-shadow:0 0 0 4px #9fbfff,var(--shadow);display:grid;place-items:center;position:relative;flex:none}
.ph .big svg{width:98px;height:98px}
.ph .big::before{content:"👑";position:absolute;top:-22px;font-size:28px}
.ph h2{margin:0;font-size:22px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:6px}
.ph .vf{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px}
.ph .ctry{display:inline-flex;gap:6px;align-items:center;margin:6px 0;padding:5px 12px;background:#fff;border-radius:999px;font-weight:800;font-size:13.5px;box-shadow:0 2px 8px rgba(43,89,232,.1)}
.ph q{display:block;font-style:italic;font-weight:700;color:#41508a;font-size:14px}
.fstats{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 6px}
.fstats div{text-align:center;font-weight:700;color:var(--muted);font-size:13px}
.fstats div + div{border-left:1px solid var(--line)}
.fstats b{display:block;font-size:20px;font-weight:900;color:var(--navy)}
.ach{padding:16px;background:linear-gradient(160deg,#fff5d6,#fff 75%)}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.medal .m{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:28px;border:4px solid #ffd76a;box-shadow:0 4px 0 #e2a800}
.medal b{display:block;font-size:14px;font-weight:900;color:var(--navy)}
.medal small{font-size:12px;font-weight:700;color:var(--muted)}
.menu{padding:4px}
.mi{display:flex;align-items:center;gap:14px;padding:13px 14px;width:100%;text-align:left;border-radius:16px}
.mi + .mi{border-top:1px solid #f0f3fa}
.mi .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:#eef2fb;flex:none}
.mi b{display:block;font-weight:900;color:var(--navy);font-size:15px}
.mi small{color:var(--muted);font-weight:700;font-size:12.5px}
.mi .chev{margin-left:auto;font-weight:900;color:var(--navy)}
.mi:hover{background:#f6f8fe}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;z-index:20;display:none}
.ov.show{display:flex}
.lesson{flex-direction:column;background:#fff}
.l-head{display:flex;align-items:center;gap:14px;padding:18px 18px 8px;max-width:760px;width:100%;margin:0 auto}
.l-head .x{font-size:22px;color:var(--faint);font-weight:900;width:32px}
.l-head .bar{flex:1;height:16px}
.l-head .bar i{background:linear-gradient(90deg,#4fd38f,#1fb873)}
.l-head .hearts{font-weight:900;color:var(--red);font-size:16px;white-space:nowrap}
.l-body{flex:1;overflow-y:auto;padding:16px 18px;max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.l-body h2{margin:6px 0 0;font-size:23px;font-weight:900;color:var(--navy)}
.l-tag{font-size:12px;font-weight:900;color:var(--purple);text-transform:uppercase;letter-spacing:.06em}
.say{display:flex;align-items:flex-end;gap:10px}
.say svg{width:86px;height:86px;flex:none}
.bubble{position:relative;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:800;font-size:17px;color:var(--navy);background:#fff;margin-bottom:24px}
.bubble::before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.word{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:900;color:var(--navy)}
.word small{display:block;font-size:15px;color:var(--muted);font-weight:700}
.spk{width:52px;height:52px;border-radius:16px;background:var(--blue);color:#fff;font-size:24px;display:grid;place-items:center;box-shadow:0 4px 0 #1d43b8;flex:none}
.spk:active{transform:translateY(2px);box-shadow:0 2px 0 #1d43b8}
.listen{display:flex;gap:14px;justify-content:center;padding:10px 0}
.listen .spk{width:110px;height:110px;border-radius:28px;font-size:48px}
.listen .spk.slow{width:70px;height:70px;font-size:28px;align-self:flex-end;background:#6f8dff;box-shadow:0 4px 0 #3e60d6}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@container app (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:#fff;text-align:left;font-weight:800;font-size:17px;color:var(--navy)}
.opt .k{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--faint);flex:none}
.opt small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.opt:hover:not(:disabled){background:#f7f9ff}
.opt.sel{border-color:#7ea0ff;background:#eaf0ff}
.opt.sel .k{border-color:#7ea0ff;color:var(--blue)}
.opt.right{border-color:#5fd39c;background:var(--green-soft)}
.opt.wrong{border-color:#ff97a3;background:var(--red-soft)}
.aline{min-height:68px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:4px 0 10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:6px}
.wchip{padding:9px 14px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:#fff;font-weight:800;font-size:17px;color:var(--navy);line-height:1.15;text-align:center}
.wchip small{display:block;font-size:11px;color:var(--muted)}
.wchip.used{background:#eef1f7;color:transparent;border-color:#eef1f7}
.wchip.used small{color:transparent}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mb{padding:14px 10px;border-radius:16px;border:2px solid var(--line);border-bottom-width:4px;background:#fff;font-weight:800;font-size:16.5px;color:var(--navy);text-align:center}
.mb.sel{border-color:#7ea0ff;background:#eaf0ff}
.mb.done{opacity:.35;border-color:#5fd39c;background:var(--green-soft)}
.mb.bad{border-color:#ff97a3;background:var(--red-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.l-foot{border-top:2px solid #eef1f7;padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
.l-foot .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.l-foot.ok{background:var(--green-soft);border-color:transparent}
.l-foot.bad{background:var(--red-soft);border-color:transparent}
.fb{display:flex;align-items:center;gap:12px}
.fb .i{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;flex:none}
.fb b{display:block;font-size:20px;font-weight:900}
.ok .fb b{color:var(--green-d)}
.bad .fb b{color:var(--red-d)}
.fb span{font-weight:800;color:var(--navy)}
@container app (min-width:760px){
  .l-foot .in{flex-direction:row;align-items:center;justify-content:space-between}
  .l-foot .btn{min-width:200px}
}
.done-scr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.done-scr svg{width:170px;height:170px;animation:bounce 1.2s infinite}
.done-scr h2{margin:0;font-size:28px;font-weight:900;color:#f0a400}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.tile{border-radius:16px;border:2px solid;overflow:hidden;font-weight:900}
.tile small{display:block;color:#fff;font-size:11.5px;padding:4px;text-transform:uppercase;letter-spacing:.04em}
.tile div{padding:10px 4px;font-size:19px;background:#fff}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.sheet-wrap{position:absolute;inset:0;z-index:30;background:rgba(17,24,55,.45);display:none;align-items:flex-end;justify-content:center}
.sheet-wrap.show{display:flex;animation:fade .2s}
.sheet{background:#fff;width:100%;max-height:88%;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.3,1)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#dfe5f2;margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:900;color:var(--navy)}
.sheet .lead{margin:0 0 16px;color:var(--muted);font-weight:700;font-size:14px}
.sheet .note{font-size:12px;color:var(--faint);font-weight:700;text-align:center;margin-top:10px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.lrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:2px solid var(--line);width:100%;text-align:left;margin-bottom:8px}
.lrow.on{border-color:var(--blue);background:var(--blue-soft)}
.lrow .fl{font-size:30px}
.lrow b{display:block;font-weight:900;color:var(--navy)}
.lrow small{color:var(--muted);font-weight:700;font-size:12.5px}
.lrow .bar{width:80px;margin-left:auto;height:8px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.day{flex:none;width:62px;padding:8px 0;border-radius:14px;border:2px solid var(--line);text-align:center;font-weight:800;font-size:12px;color:var(--muted)}
.day b{display:block;font-size:18px;color:var(--navy)}
.day.on{border-color:var(--blue);background:var(--blue-soft)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.slot{padding:10px 0;border-radius:12px;border:2px solid var(--line);font-weight:900;color:var(--navy)}
.slot:disabled{color:#c3cadc;text-decoration:line-through;border-style:dashed}
.slot.on{border-color:var(--blue);background:var(--blue);color:#fff}
.durs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.plan{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:2px solid var(--line);width:100%;text-align:left;margin-bottom:8px;position:relative}
.plan.on{border-color:var(--purple);background:#f4f0ff}
.plan b{display:block;font-weight:900;color:var(--navy)}
.plan small{color:var(--muted);font-weight:700}
.plan .p{margin-left:auto;font-weight:900;color:var(--navy);text-align:right}
.plan .save{position:absolute;top:-10px;right:14px;background:var(--purple);color:#fff;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px}
.feat{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}
.feat li{display:flex;gap:10px;align-items:center;font-weight:800;color:var(--navy)}
.feat li span{width:30px;height:30px;border-radius:10px;background:var(--lav);display:grid;place-items:center}
.nt{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #f0f3fa}
.nt .ic{font-size:24px}
.nt b{display:block;font-weight:900;color:var(--navy);font-size:14.5px}
.nt small{color:var(--muted);font-weight:700}
.chat{display:flex;flex-direction:column;gap:8px;min-height:200px;max-height:300px;overflow-y:auto;padding:8px 2px;margin-bottom:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;font-weight:700;font-size:14px;line-height:1.35}
.msg.them{background:#eef2fb;color:var(--navy);border-bottom-left-radius:6px}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg .who{display:block;font-size:11px;font-weight:900;opacity:.7;margin-bottom:2px}
.cin{display:flex;gap:8px}
.cin input{flex:1;border:2px solid var(--line);border-radius:999px;padding:11px 16px;font:inherit;font-weight:700;color:var(--navy);outline:none}
.cin input:focus{border-color:#7ea0ff}
.tog{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f3fa;font-weight:800;color:var(--navy)}
.sw{width:48px;height:28px;border-radius:999px;background:#d6dceb;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}
.sw.on::after{left:23px}
.sel-in{border:2px solid var(--line);border-radius:12px;padding:8px 10px;font:inherit;font-weight:800;color:var(--navy);background:#fff}
.wk{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 0}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;font-weight:800;color:var(--muted)}
.wk i{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#7ea0ff,#2b59e8)}
.wk div.today i{background:linear-gradient(180deg,#ffd84d,#ffae00)}
.stars{display:flex;gap:6px;justify-content:center;font-size:36px;margin:8px 0 16px}
.stars button{filter:grayscale(1);opacity:.4}
.stars button.on{filter:none;opacity:1}

.call{flex-direction:column;background:#0f1430;color:#fff}
.call .vid{flex:1;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2c3b7a,#0f1430 70%)}
.call .vid .av{width:130px;height:130px;font-size:44px}
.call .meta{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.call .meta b{display:block;font-size:18px}
.call .meta small{opacity:.75}
.call .rec{background:rgba(255,255,255,.12);padding:6px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.call .self{position:absolute;right:18px;bottom:18px;width:110px;height:150px;border-radius:18px;background:linear-gradient(160deg,#d6e6ff,#a8c6ff);display:grid;place-items:center;border:3px solid rgba(255,255,255,.3)}
.call .self svg{width:80px;height:80px}
.call .self.off{background:#232a4f}
.call .self.off svg{display:none}
.call .self.off::after{content:attr(data-off);font-size:12px;font-weight:800;opacity:.7}
.call .status{margin-top:14px;font-weight:800;opacity:.8;text-align:center}
.call .sub{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.45);padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px;max-width:70%;text-align:center}
.ctrls{display:flex;justify-content:center;gap:16px;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.cb{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:24px}
.cb.off{background:#fff;color:#0f1430}
.cb.end{background:var(--red);width:72px}

.toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-20px);z-index:50;background:var(--navy);color:#fff;font-weight:800;font-size:14px;padding:12px 18px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

    <h1 id="ph-title"></h1>
    <p id="ph-sub"></p>

<div class="stage" id="stage" data-mode="mobile">
  <div class="device">
    <div class="app" id="app">
      <div class="shell">
        <aside class="side" id="side"></aside>
        <div class="center">

let toastT;
function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2600);
}
function speak(text, rate = 1) {
  if (!("speechSynthesis" in window)) { toast(t("noTts")); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = L().tts; u.rate = rate;
  const v = speechSynthesis.getVoices().find((v) => v.lang && v.lang.toLowerCase().startsWith(L().tts.slice(0, 2)));
  if (v) u.voice = v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function timeLeft() {
  const now = new Date(), end = new Date(now); end.setHours(24, 0, 0, 0);
  const m = Math.floor((end - now) / 60000);
  return t("timeLeft", { h: Math.floor(m / 60), m: m % 60 });
}
function myRankList() {
  return [...LEAGUE, { n: `${t("me").first} (${t("you")})`, a: "🦁", g: S.weekly, me: true }].sort((a, b) => b.g - a.g);
}
// Tarayıcıların çoğunda Türkmence (tk) Intl verisi yok; gün/ay adları elle verilir
const TK_DAYS = ["Ýekşenbe", "Duşenbe", "Sişenbe", "Çarşenbe", "Penşenbe", "Anna", "Şenbe"];
const TK_MONTHS = ["ýanwar", "fewral", "mart", "aprel", "maý", "iýun", "iýul", "awgust", "sentýabr", "oktýabr", "noýabr", "dekabr"];
function weekdayShort(d) {
  if (S.ui === "tk") return TK_DAYS[d.getDay()].slice(0, 3);
  try { return d.toLocaleDateString(loc(), { weekday: "short" }); } catch (e) { return d.toDateString().slice(0, 3); }
}
function dateLong(d) {
  if (S.ui === "tk") return `${d.getDate()} ${TK_MONTHS[d.getMonth()]}, ${TK_DAYS[d.getDay()]}`;
  try { return d.toLocaleDateString(loc(), { weekday: "long", day: "numeric", month: "long" }); } catch (e) { return d.toDateString(); }
}
function dayLabel(off) {
  if (off === 0) return t("today");
  if (off === 1) return t("tomorrow");
  const d = new Date(); d.setDate(d.getDate() + off);
  return weekdayShort(d);
}
function bookingWhen(b) {
  const d = new Date(b.date);
  const off = Math.round((new Date(d.toDateString()) - new Date(new Date().toDateString())) / 864e5);
  const label = off === 0 ? t("today") : off === 1 ? t("tomorrow") : dateLong(d);
  return `${label} · ${b.slot}`;
}

// Hedef dil metni kursa, açıklama/çeviri tarafı arayüz (kaynak) diline göre gelir.
function buildExercises(lang) {
  const D = LANGS[lang], src = t("src");
  const opts = (arr) => shuffle(arr.map((o, i) => ({ t: o[0], s: o[1], ok: i === 0 })));
  return [
    { kind: "choice", title: t("exChoice"), prompt: t("promptHello", { w: src.hello }), opts: opts(D.greet), speakOpts: true },
    { kind: "listen", title: t("exListen"), audio: D.listen[0][0], opts: opts(D.listen), speakOpts: true },
    { kind: "arrange", title: t("exArrange"), prompt: src.sentence, answer: D.sent, bank: shuffle([...D.sent, ...D.distract]) },
    { kind: "match", title: t("exMatch"), pairs: D.pairs.map((w, i) => [w, src.pairs[i]]) },
    { kind: "choice", title: t("exMeaning"), word: D.thanks[0], wordSub: D.thanks[1], opts: opts(src.thanks.map((w) => [w])) },
  ].map((e, i) => ({ ...e, id: i }));
}
let LS = null;
function startLesson(mode, node) {
  if (!S.premium && S.hearts <= 0) { openSheet(heartsSheet); return; }
  let q = buildExercises(S.lang);
  if (mode === "mistakes") q = q.filter((x) => S.mistakes[S.lang].includes(x.id));
  if (mode === "practice") q = shuffle(q);
  LS = { mode, node, q, i: 0, total: q.length, correct: 0, wrong: 0, start: Date.now(), sel: null, arr: [], checked: false, ok: false, match: null };
  $("#lesson").classList.add("show");
  renderLesson();
}
const cur = () => LS.q[LS.i];
function sub(word) { const s = L().sub[word]; return s ? `<small>${esc(s)}</small>` : ""; }

function renderLesson() {
  const ex = cur();
  const pct = Math.round(LS.correct / LS.total * 100);
  const tag = { lesson: `${NODE_ICONS[LS.node]} ${t("nodes")[LS.node]}`, practice: t("tagPractice"), mistakes: t("tagExtra") }[LS.mode];
  let body = "", canCheck = false;

  if (ex.kind === "choice" || ex.kind === "listen") {
    canCheck = LS.sel !== null;
    const head = ex.kind === "listen"
      ? `<div class="listen"><button class="spk" data-act="say" data-arg="${esc(ex.audio)}" aria-label="${esc(t("listenA"))}">🔊</button><button class="spk slow" data-act="saySlow" data-arg="${esc(ex.audio)}" aria-label="${esc(t("slowA"))}">🐢</button></div>`
      : ex.word
        ? `<div class="word"><button class="spk" data-act="say" data-arg="${esc(ex.word)}" aria-label="${esc(t("listenA"))}">🔊</button><span>${esc(ex.word)}${ex.wordSub ? `<small>${esc(ex.wordSub)}</small>` : ""}</span></div>`
        : `<div class="say">${lionSvg()}<div class="bubble">${esc(ex.prompt)}</div></div>`;
    body = head + `<div class="opts">${ex.opts.map((o, i) => {
      let c = LS.sel === i ? "sel" : "";
      if (LS.checked) c = o.ok ? "right" : LS.sel === i ? "wrong" : "";
      return `<button class="opt ${c}" data-act="pick" data-arg="${i}" ${LS.checked ? "disabled" : ""}><span class="k">${i + 1}</span><span>${esc(o.t)}${o.s ? `<small>${esc(o.s)}</small>` : ""}</span></button>`;
    }).join("")}</div>`;
  } else if (ex.kind === "arrange") {
    canCheck = LS.arr.length > 0;
    body = `<div class="say">${lionSvg()}<div class="bubble">${esc(ex.prompt)}</div></div>
      <div class="aline">${LS.arr.map((b, k) => `<button class="wchip" data-act="unarr" data-arg="${k}" ${LS.checked ? "disabled" : ""}>${esc(ex.bank[b])}${sub(ex.bank[b])}</button>`).join("")}</div>
      <div class="bank">${ex.bank.map((w, b) => `<button class="wchip ${LS.arr.includes(b) ? "used" : ""}" data-act="arr" data-arg="${b}" ${LS.checked || LS.arr.includes(b) ? "disabled" : ""}>${esc(w)}${sub(w)}</button>`).join("")}</div>`;
  } else if (ex.kind === "match") {
    if (!LS.match) LS.match = { l: shuffle(ex.pairs.map((_, i) => i)), r: shuffle(ex.pairs.map((_, i) => i)), sl: null, sr: null, done: [], bad: null };
    const M = LS.match;
    const cell = (side, i) => {
      const txt = side === "l" ? ex.pairs[i][0] : ex.pairs[i][1];
      const c = M.done.includes(i) ? "done" : M["s" + side] === i ? "sel" : M.bad && M.bad[side] === i ? "bad" : "";
      return `<button class="mb ${c}" data-act="m${side}" data-arg="${i}" ${M.done.includes(i) || LS.checked ? "disabled" : ""}>${esc(txt)}${side === "l" ? sub(txt) : ""}</button>`;
    };
    body = `<div class="match"><div class="col">${M.l.map((i) => cell("l", i)).join("")}</div><div class="col">${M.r.map((i) => cell("r", i)).join("")}</div></div>`;
  }

  let foot;
  if (LS.checked) {
    const praise = t("praise");
    const good = praise[Math.floor(Math.random() * praise.length)];
    foot = `<div class="l-foot ${LS.ok ? "ok" : "bad"}"><div class="in">
      <div class="fb"><span class="i">${LS.ok ? "✅" : "❌"}</span><div><b>${LS.ok ? good : t("rightAnswer")}</b>${LS.ok ? "" : `<span>${esc(rightAnswer(ex))}</span>`}</div></div>
      <button class="btn ${LS.ok ? "btn-g" : "btn-r"} btn-block" data-act="next">${t("next")}</button></div></div>`;
  } else {
    foot = `<div class="l-foot"><div class="in"><span style="color:var(--muted);font-weight:800;font-size:13px">${ex.kind === "match" ? t("matchHint") : t("keyHint")}</span>
      <button class="btn btn-g btn-block" data-act="check" ${canCheck ? "" : "disabled"}>${ex.kind === "match" ? t("doMatch") : t("check")}</button></div></div>`;
  }

  $("#lesson").innerHTML = `
    <div class="l-head"><button class="x" data-act="quit" aria-label="${esc(t("quitLesson"))}">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="hearts">❤️ ${S.premium ? "∞" : S.hearts}</span></div>
    <div class="l-body"><div class="l-tag">${tag}</div><h2>${ex.title}</h2>${body}</div>
    ${foot}`;
  if (ex.kind === "listen" && !LS.checked && LS.sel === null && !LS.played) { LS.played = true; setTimeout(() => speak(ex.audio), 250); }
}
function rightAnswer(ex) {
  if (ex.kind === "arrange") return ex.answer.join(L().joiner);
  if (ex.opts) { const o = ex.opts.find((o) => o.ok); return o.t + (o.s ? ` (${o.s})` : ""); }
  return "";
}
function check() {
  const ex = cur(); let ok = true;
  if (ex.kind === "choice" || ex.kind === "listen") ok = ex.opts[LS.sel].ok;
  else if (ex.kind === "arrange") ok = LS.arr.map((b) => ex.bank[b]).join("|") === ex.answer.join("|");
  LS.checked = true; LS.ok = ok;
  if (ok) {
    LS.correct++; S.quests.correct++;
    if (LS.mode === "mistakes") S.mistakes[S.lang] = S.mistakes[S.lang].filter((id) => id !== ex.id);
  } else {
    LS.wrong++;
    if (!S.premium) S.hearts = Math.max(0, S.hearts - 1);
    if (!S.mistakes[S.lang].includes(ex.id)) S.mistakes[S.lang].push(ex.id);
    LS.q.push(buildExercises(S.lang)[ex.id]);
  }
  save(); renderTop(); renderLesson();
}
function next() {
  if (!S.premium && S.hearts <= 0) { closeLesson(); openSheet(heartsSheet); return; }
  LS.i++; LS.sel = null; LS.arr = []; LS.checked = false; LS.match = null; LS.played = false;
  if (LS.i >= LS.q.length) return finishLesson();
  renderLesson();
}
function finishLesson() {
  const sec = Math.round((Date.now() - LS.start) / 1000);
  const acc = Math.round(LS.total / (LS.total + LS.wrong) * 100);
  const earned = (LS.mode === "lesson" ? 20 : 10) + (LS.wrong === 0 ? 5 : 0);
  S.gems += earned; S.weekly += earned;
  S.quests.lessons++; S.quests.minutes += Math.max(1, Math.round(sec / 60));
  if (LS.mode === "lesson" && LS.node === S.progress[S.lang] && S.progress[S.lang] < NODE_ICONS.length) S.progress[S.lang]++;
  let streakUp = false;
  if (!S.doneToday) { S.doneToday = true; S.streak++; streakUp = true; }
  save();
  $("#lesson").innerHTML = `<div class="done-scr">
    ${lionSvg("lion-hoodie")}
    <h2>${LS.mode === "lesson" ? t("lessonDone") : t("practiceDone")}</h2>
    <div style="color:var(--muted);font-weight:800">${LS.wrong === 0 ? t("perfect") : t("mistakesAdded")}</div>
    <div class="tiles">
      <div class="tile" style="border-color:#5b8bff"><small style="background:#5b8bff">${t("gems")}</small><div>💎 +${earned}</div></div>
      <div class="tile" style="border-color:#1fb873"><small style="background:#1fb873">${t("accuracy")}</small><div>🎯 ${t("mAcc", { n: acc })}</div></div>
      <div class="tile" style="border-color:#ffb800"><small style="background:#ffb800">${t("time")}</small><div>⏱ ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}</div></div>
    </div>
    <button class="btn btn-y" style="min-width:240px;margin-top:10px" data-act="closeDone" data-arg="${streakUp ? 1 : 0}">${t("cont").replace(" ▶", "")}</button>
  </div>`;
}
function closeLesson() { $("#lesson").classList.remove("show"); $("#lesson").innerHTML = ""; LS = null; render(); }

  lockedUnit: () => toast(t("unitLocked")),
  course: (i) => openSheet(() => courseSheet(+i)),
  own: (i) => { S.owned.push(S.lang + i); save(); closeSheet(); render(); toast(t("owned")); },
  tfilter: (f) => { teacherFilter = f; render(); },
  book: (i) => { BK = { ti: +i, day: 1, slot: null, dur: 25 }; openSheet(bookSheet); },
  bday: (d) => { BK.day = +d; BK.slot = null; refreshSheet(); },
  bslot: (s) => { BK.slot = s; refreshSheet(); },
  bdur: (d) => { BK.dur = +d; refreshSheet(); },
  bconfirm: () => {
    const tc = TEACHERS[S.lang][BK.ti]; const d = new Date(); d.setDate(d.getDate() + BK.day);
    S.booked.unshift({ lang: S.lang, ti: BK.ti, dur: BK.dur, date: d.toISOString(), slot: BK.slot });
    save(); closeSheet(); render(); toast(t("booked", { n: tc.n }));
  },
  callNow: (i) => openCall(TEACHERS[S.lang][+i]),
  cmic: (_, el) => { callState.mic = !callState.mic; el.classList.toggle("off", !callState.mic); el.textContent = callState.mic ? "🎙️" : "🔇"; },
  ccam: (_, el) => { callState.cam = !callState.cam; el.classList.toggle("off", !callState.cam); $("#cself").classList.toggle("off", !callState.cam); },
  cchat: () => toast(t("callNotes")),
  cend: () => endCall(),
  rate: (n) => { rateVal = +n; refreshSheet(); },
  rateSend: () => { closeSheet(); toast(t("rated")); },
  stats: () => openSheet(statsSheet),
  settings: () => openSheet(settingsSheet),
  sw: (k) => { settings[k] = !settings[k]; refreshSheet(); },
  support: () => { openSheet(supportSheet); const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight; },
  favs: () => toast(t("noFavs")),
  soon: () => toast(t("soon")),
  logout: () => toast(t("noLogout")),
  reset: () => { const ui = S.ui; S = JSON.parse(JSON.stringify(DEFAULT)); S.ui = ui; chatLog = [{ me: false, key: "supportHi" }]; save(); closeSheet(); render(); toast(t("reset")); },
  say: (x) => speak(x),
  saySlow: (x) => speak(x, 0.6),
  pick: (i) => { if (LS.checked) return; LS.sel = +i; const o = cur().opts[LS.sel]; if (cur().speakOpts) speak(o.t); renderLesson(); },
  arr: (b) => { b = +b; if (LS.checked || LS.arr.includes(b)) return; LS.arr.push(b); speak(cur().bank[b]); renderLesson(); },
  unarr: (k) => { if (LS.checked) return; LS.arr.splice(+k, 1); renderLesson(); },
  ml: (i) => matchPick("l", +i),
  mr: (i) => matchPick("r", +i),
  check: () => { if (cur().kind !== "match") check(); },
  next: () => next(),
  quit: () => { closeLesson(); toast(t("quit")); },
  closeDone: (up) => { closeLesson(); if (up === "1") setTimeout(() => toast(t("streakUp", { n: S.streak })), 300); },
};
function matchPick(side, i) {
  const M = LS.match, ex = cur();
  M.bad = null; M["s" + side] = i;
  if (side === "l") speak(ex.pairs[i][0]);
  if (M.sl !== null && M.sr !== null) {
    if (M.sl === M.sr) M.done.push(M.sl);
    else { M.bad = { l: M.sl, r: M.sr }; LS.wrong++; }
    M.sl = M.sr = null;
  }
  if (M.done.length === ex.pairs.length) { check(); return; }
  renderLesson();
}

/* ================= events ================= */
$("#app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) fn(el.dataset.arg, el, e);
});
$("#app").addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.dataset.form === "code") {
    const v = $("#code-in").value.trim().toUpperCase();
    // Demo: SIMBA-XXXX-XXXX biçimindeki her kod kabul edilir; gerçekte billing servisi doğrular
    if (/^SIMBA-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(v)) { codeErr = false; S.premium = true; save(); closeSheet(); render(); toast(t("codeOk")); }
    else { codeErr = true; refreshSheet(); }
    return;
  }
  if (e.target.dataset.form !== "chat") return;
  const inp = $("#chat-in"), msg = inp.value.trim(); if (!msg) return;
  chatLog.push({ me: true, t: msg }); refreshSheet();
  setTimeout(() => {
    chatLog.push({ me: false, key: "supportReply", id: 48000 + Math.floor(Math.random() * 999) });
    if (sheetFn === supportSheet) { refreshSheet(); const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight; }
  }, 900);
  const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight;
  setTimeout(() => $("#chat-in") && $("#chat-in").focus(), 0);
});
$("#app").addEventListener("change", (e) => {
  if (e.target.dataset.change === "uiLang") setUi(e.target.value);
});
document.querySelectorAll("#ui-seg button").forEach((b) => (b.onclick = () => setUi(b.dataset.ui)));
document.addEventListener("keydown", (e) => {
  if (!LS || !$("#lesson").classList.contains("show")) return;
  const ex = cur(); if (!ex) return;
  if (e.target.tagName === "INPUT") return;
  if (e.key === "Enter") { e.preventDefault(); if (LS.checked) next(); else if (ex.kind !== "match" && (LS.sel !== null || LS.arr.length)) check(); }
  else if (!LS.checked && ex.opts && /^[1-4]$/.test(e.key)) A.pick(+e.key - 1);
});
const stage = $("#stage");
function setMode(m) {
  stage.dataset.mode = m;
  $("#m-mobile").classList.toggle("on", m === "mobile"); $("#m-web").classList.toggle("on", m === "web");
  try { localStorage.setItem("simba-demo-mode", m); } catch (e) {}
}
$("#m-mobile").onclick = () => setMode("mobile");
$("#m-web").onclick = () => setMode("web");
try { const m = localStorage.getItem("simba-demo-mode"); if (m) setMode(m); } catch (e) {}
setInterval(() => document.querySelectorAll("[data-timer]").forEach((el) => (el.textContent = "⏱ " + timeLeft())), 30000);
if ("speechSynthesis" in window) speechSynthesis.getVoices();
if (!targets().includes(S.lang)) S.lang = "en";
render();
</script>
